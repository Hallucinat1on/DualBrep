<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__CASE_TITLE__</title><script src="../../assets/plotly.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f1f5fa;--ink:#172033;--muted:#526176;--border:#d8e1ed;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,sans-serif}header{padding:18px 25px;background:#fff;border-bottom:1px solid var(--border)}h1{font-size:23px;line-height:1.3;margin:6px 0}h2{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}a{color:var(--blue)}.badge{display:inline-block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:5px;padding:2px 8px}.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.step{padding:4px 10px;background:#eef2f7;border-radius:5px}.step.fail{background:#fee2e2;color:#b91c1c;font-weight:700}.step.done{background:#dcfce7;color:#166534}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:14px 18px}button,select{font:inherit;padding:7px 11px;border:1px solid #bdcce0;background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;margin:0 18px 18px}.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--border);border-radius:9px;overflow:hidden}.viewtitle{padding:10px 13px;border-bottom:1px solid var(--border);font-weight:650}.scene{height:560px;min-width:0}.panel{padding:14px;overflow:auto;max-height:1000px}.panel section{margin-bottom:20px}.layers label{display:block;margin:6px 0;cursor:pointer}.layers input{vertical-align:middle}.detail{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;padding:9px;border-radius:5px;max-height:270px;overflow:auto}.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.plot{height:370px}.plotcard h2{padding:12px 14px 0}.note{border-left:3px solid #93c5fd;padding-left:9px;color:#475569;font-size:13px;margin:10px 0}.error{padding:14px;color:#b91c1c}table{font-size:12px;border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid var(--border);padding:6px 4px}.status{margin-left:auto;color:#64748b;font-size:12px}.wide{grid-column:1/-1}input[type=range]{width:120px}footer{padding:0 25px 25px;color:#64748b}summary{cursor:pointer;font-weight:600}@media(max-width:1200px){.workspace{grid-template-columns:1fr}.panel{max-height:none}.layers{display:flex;flex-wrap:wrap;gap:12px}.panel section{margin-bottom:12px}}@media(max-width:760px){.views,.plots{grid-template-columns:1fr}.scene{height:430px}.toolbar{margin:10px}.workspace{margin:0 10px 12px}header{padding:14px}}
</style></head><body>
<header><a href="../../index.html">← 全部案例</a><h1 id="title"></h1><div id="explanation"></div><div class="flow" id="flow"></div></header>
<div class="toolbar" id="tools"><select id="mode" aria-label="诊断视图"></select><button id="local">聚焦失败位置</button><button id="global">全局</button><button id="reset">重置视角</button><label><input id="sync" type="checkbox" checked>同步旋转</label><label><input id="minority" type="checkbox">只看次要支撑</label><label>支撑色 <select id="field"><option value="instance">实例/真实归属</option><option value="e">dE</option><option value="v">dV</option></select></label><label><input id="faceTruth" type="checkbox">面按GT映射着色</label><label>偏差 ×<span id="factor">1</span> <input id="scale" type="range" min="0" max="3" step=".1" value="0" aria-label="偏差显示放大倍数"></label><span id="status" class="status">加载中…</span></div>
<main class="workspace"><div><div class="views"><div class="card"><div class="viewtitle" id="leftTitle"></div><div id="left" class="scene"></div></div><div class="card"><div class="viewtitle" id="rightTitle"></div><div id="right" class="scene"></div></div></div><div id="plots" class="plots"></div></div>
<aside class="card panel"><section><h2>图层</h2><div id="layers" class="layers"></div></section><section><h2>失败现场</h2><div id="failure" class="detail"></div></section><section><h2>点击查询</h2><div id="selection" class="detail">点击点、曲线或面查看实体ID。悬停支撑可看原始node ID和E/V值。图例也可单独隐藏实体。</div></section><section id="ownership"></section><section id="parameterTable"></section><section><h2>如何阅读</h2><div id="notes"></div></section><details><summary>诊断数值与来源</summary><div id="evidence" class="detail"></div></details></aside></main>
<footer id="footer"></footer>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('payload').textContent),M=D.metadata;
const $=id=>document.getElementById(id), palette=['#2563eb','#ea580c','#059669','#9333ea','#db2777','#0891b2','#ca8a04','#475569','#65a30d','#7c3aed','#dc2626','#0d9488'];
const layerNames={background:'半透明背景',faces:'面分割/支撑面',support:'边实例支撑',vertex_domain:'局部顶点域',vertices:'预测/真实顶点',prediction:'已完成的预测曲线',truth:'真实CAD边',missing:'缺失真实面/边',diagnostic:'诊断路径/曲面/接缝',displacement:'偏差连线'};
const modes={local:'分割与关联',ordering:'闭环排序重放',surface:'UV与边界约束',seam:'接缝修复前后',parameters:'SameParameter诊断'};
let mode=Object.keys(D.views).at(-1),camera={eye:{x:1.5,y:1.5,z:1.15},up:{x:0,y:0,z:1}},bounds=D.views[mode].bounds,busy=false,synchronizing=false,queued=false;
const hidden=new Set(['vertex_domain']);
$('title').textContent=M.id+' · '+M.title;$('explanation').textContent=M.explanation;
$('failure').textContent=JSON.stringify({stage:M.stage,...M.error,face_good:M.fixed_face_good,graph_good:M.fixed_graph_good,counts:M.counts},null,2);
$('evidence').textContent=JSON.stringify({source:M.source_group,diagnostics:D.diagnostics},null,2).slice(0,26000);
$('footer').textContent=`工作网格 ${M.original_triangles.toLocaleString()} 个三角形；局部展示最多 ${M.displayed_triangles.toLocaleString()} 个。展示抽样保留分组；精确计数与可见点数分别列出。`;
for(const note of M.notes){const p=document.createElement('p');p.className='note';p.textContent=note;$('notes').appendChild(p)}
const stages=['bands','graph','vertices','curves','postprocess','surfaces','cad'];let failure=stages.indexOf(M.stage);
for(let i=0;i<stages.length;i++){let s=document.createElement('span');s.className='step '+(i<failure?'done':i===failure?'fail':'');s.textContent=stages[i]+(i<3?'（复用）':i===failure?' · 失败':'');$('flow').appendChild(s)}
for(const [key,v]of Object.entries(D.views)){let opt=document.createElement('option');opt.value=key;opt.textContent=modes[key]||key;$('mode').appendChild(opt)}$('mode').value=mode;
const available=new Set(Object.values(D.views).flatMap(v=>[...v.left,...v.right]).filter(Boolean).map(t=>t.meta?.layer));
for(const [key,label]of Object.entries(layerNames)){if(!available.has(key))continue;let row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!hidden.has(key);check.onchange=()=>{check.checked?hidden.delete(key):hidden.add(key);render()};row.append(check,document.createTextNode(' '+label));$('layers').appendChild(row)}
const ownership=D.diagnostics.support_ownership;
if(ownership){let h=document.createElement('h2');h.textContent='全部支撑的真实归属';$('ownership').appendChild(h);let table=document.createElement('table');table.innerHTML='<tr><th>真实边</th><th>全部点</th><th>显示点</th></tr>';for(const [id,n]of Object.entries(ownership.counts)){let row=table.insertRow();for(const text of ['E'+id,n,ownership.display_counts[id]]){row.insertCell().textContent=text}}$('ownership').appendChild(table)}else{$('minority').disabled=true}
if(D.diagnostics.pcurve_probe){let h=document.createElement('h2');h.textContent='拒绝面边参数';$('parameterTable').appendChild(h);let t=document.createElement('table');t.innerHTML='<tr><th>边#</th><th>标志</th><th>最大采样差</th><th>容差</th></tr>';for(const r of D.diagnostics.pcurve_probe){let row=t.insertRow();for(const x of [r.index,String(r.same_parameter),r.max_sampled_error.toExponential(2),r.tolerance.toExponential(2)])row.insertCell().textContent=x} $('parameterTable').appendChild(t)}
const clone=o=>JSON.parse(JSON.stringify(o));
function traces(side){return D.views[mode][side].filter(Boolean).map(original=>{let t=clone(original);let layer=t.meta?.layer;t.visible=!hidden.has(layer);if(layer==='support'){
 if($('minority').checked&&ownership){const max=Math.max(...Object.values(ownership.counts));if(t.meta.owners){let ids=t.meta.owners.map((o,i)=>ownership.counts[String(o)]<max?i:-1).filter(i=>i>=0);for(const k of ['x','y','z','text','customdata'])if(Array.isArray(t[k]))t[k]=ids.map(i=>t[k][i]);}else if(t.meta.truth_owner!==undefined&&ownership.counts[String(t.meta.truth_owner)]>=max)t.visible=false;}
 if($('field').value!=='instance'&&t.customdata){let ch=$('field').value==='e'?0:1;t.marker.color=t.customdata.map(v=>v[ch]);t.marker.colorscale='Turbo';t.marker.cmin=0;t.marker.cmax=$('field').value==='e'?.025:.02;t.marker.showscale=true;t.marker.colorbar={title:$('field').value==='e'?'dE':'dV',thickness:12,len:.45};}
 }
 if($('faceTruth').checked&&layer==='faces'){const m=t.name.match(/GT F(\d+)/);if(m){let c=palette[Number(m[1])%palette.length];if(t.type==='mesh3d')t.color=c;else if(t.marker)t.marker.color=c;}}
 if(t.meta?.scale_vectors){const s=Number($('factor').textContent),a=t.meta.starts,b=t.meta.ends;for(let k=0;k<3;k++){let v=[];for(let i=0;i<a.length;i++)v.push(a[i][k],a[i][k]+s*(b[i][k]-a[i][k]),null);t[['x','y','z'][k]]=v;}}
 return t})}
function layout(){let axis=k=>({title:['x','y','z'][k],range:[bounds[0][k],bounds[1][k]],autorange:false,backgroundcolor:'#fbfcfe',gridcolor:'#e2e8f0',zeroline:false});return{margin:{l:0,r:0,t:0,b:0},paper_bgcolor:'#fff',font:{family:'system-ui',size:11,color:'#334155'},scene:{xaxis:axis(0),yaxis:axis(1),zaxis:axis(2),aspectmode:'cube',camera},legend:{x:0,y:0,font:{size:10},bgcolor:'rgba(255,255,255,.8)'},uirevision:mode+JSON.stringify(bounds)}}
function selected(event){if(!event.points?.length)return;let p=event.points[0];$('selection').textContent=JSON.stringify({entity:p.data.name,point:p.pointNumber,text:p.text,coordinates:[p.x,p.y,p.z],field:p.customdata},null,2)}
const config={responsive:true,displaylogo:false,scrollZoom:true,toImageButtonOptions:{format:'png',scale:2,filename:M.id+'_diagnostic'}};
async function render(){if(busy){queued=true;return}busy=true;$('status').textContent='绘制中…';try{$('leftTitle').textContent=D.views[mode].title_left;$('rightTitle').textContent=D.views[mode].title_right;await Promise.all(['left','right'].map(s=>Plotly.react($(s),traces(s),layout(),config)));$('status').textContent='可拖动旋转 · 滚轮缩放 · 图例切换实体';}catch(e){$('status').textContent='绘制失败：'+e.message;console.error(e)}finally{busy=false;if(queued){queued=false;render()}}}
async function start(){if(!window.Plotly){$('status').textContent='找不到本地Plotly资源，请保留assets目录';return}await render();for(const side of ['left','right']){$(side).on('plotly_click',selected);$(side).on('plotly_relayout',e=>{if(e['scene.camera']){camera=e['scene.camera'];if($('sync').checked&&!synchronizing){synchronizing=true;Plotly.relayout($(side==='left'?'right':'left'),{'scene.camera':camera}).finally(()=>synchronizing=false)}}})}
for(let i=0;i<D.plots.length;i++){let p=D.plots[i],card=document.createElement('div');card.className='card plotcard';let h=document.createElement('h2');h.textContent=p.title;card.appendChild(h);let plot=document.createElement('div');plot.className='plot';card.appendChild(plot);$('plots').appendChild(card);await Plotly.newPlot(plot,p.data,{margin:{t:20,l:65,r:25,b:55},font:{family:'system-ui',size:12},legend:{orientation:'h',y:-.2},...p.layout},config);plot.on('plotly_click',selected)}}
$('mode').onchange=()=>{mode=$('mode').value;bounds=D.views[mode].bounds;render()};$('local').onclick=()=>{bounds=D.views[mode].bounds;render()};$('global').onclick=()=>{bounds=M.global_bounds;render()};$('reset').onclick=()=>{bounds=D.views[mode].bounds;camera={eye:{x:1.5,y:1.5,z:1.15},up:{x:0,y:0,z:1}};render()};
for(const key of ['minority','field','faceTruth'])$(key).onchange=render;
$('scale').oninput=()=>{$('factor').textContent=Number(Math.pow(10,Number($('scale').value)).toPrecision(3));render()};
start().catch(e=>{$('status').textContent='页面初始化失败：'+e.message;console.error(e)});
</script></body></html>
