[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "band-brep-reconstruction"
version = "0.4.0"
description = "Mesh and continuous E/V band-label reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "veudf==2.0.0"]

[project.optional-dependencies]
models = ["torch>=2.0"]
test = ["pytest>=8"]

[project.scripts]
band-brep-reconstruct = "bandbrep.cli:main"

[tool.setuptools.packages.find]
include = ["bandbrep*"]
